name: CI/CD Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# Đảm bảo chỉ 1 workflow chạy trên cùng branch/PR tại 1 thời điểm
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ╔══════════════════════════════════════════════════════════════════╗
# ║                       PERMISSIONS                               ║
# ╚══════════════════════════════════════════════════════════════════╝
permissions:
  contents: read
  pull-requests: write  # Để comment coverage lên PR

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1: Backend CI — Lint, Migrate, Test
  # ────────────────────────────────────────────────────────────
  backend:
    name: "🐍 Backend CI (Python 3.11)"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: yag_user
          POSTGRES_PASSWORD: yag_secret
          POSTGRES_DB: yag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./src/backend

    env:
      DATABASE_URL: postgresql://yag_user:yag_secret@localhost:5432/yag_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      GEMINI_API_KEY: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Lint — Syntax errors & critical issues
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint — Code quality warnings
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run database migrations
        run: python -m app.manage_migrations

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: src/backend/coverage.xml
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # JOB 2: Frontend CI — Lint, Type-check, Build
  # ────────────────────────────────────────────────────────────
  frontend:
    name: "⚛ Frontend CI (Node.js 20)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Build check (type-safe compilation)
        run: npm run build

  # ────────────────────────────────────────────────────────────
  # JOB 3: Security Scanning — Dependency vulnerabilities
  # ────────────────────────────────────────────────────────────
  security:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Python dependencies
        working-directory: ./src/backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc --output json || true
        continue-on-error: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit npm dependencies
        working-directory: ./src/frontend
        run: npm audit --omit=dev || true
        continue-on-error: true

  # ────────────────────────────────────────────────────────────
  # JOB 4: Docker Build Validation
  # ────────────────────────────────────────────────────────────
  docker:
    name: "🐳 Docker Build Check"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -t yag-backend:ci-${{ github.sha }} ./src/backend
          echo "✅ Backend Docker image built successfully"

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL=https://ci-test.local \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://ci-test.local/api \
            --build-arg NEXT_PUBLIC_WS_BASE_URL=wss://ci-test.local/ws \
            -t yag-frontend:ci-${{ github.sha }} ./src/frontend
          echo "✅ Frontend Docker image built successfully"