services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  migrate:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    restart: "no"
    command: ["python", "-m", "app.manage_migrations"]
    environment:
      ENVIRONMENT: production
      SERVICE_ROLE: migrate
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      VNP_TMN_CODE: ${VNP_TMN_CODE:?set VNP_TMN_CODE}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET:?set VNP_HASH_SECRET}
      VNP_URL: ${VNP_URL:?set VNP_URL}
      VNP_RETURN_URL: ${VNP_RETURN_URL:?set VNP_RETURN_URL}
      VNP_API_URL: ${VNP_API_URL:?set VNP_API_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
      ALLOW_WEBSOCKET_QUERY_TOKEN: "false"
      SCHEDULER_ENABLED: "false"
      VIEW_COUNT_FLUSH_ENABLED: "false"
      AUTO_CREATE_TABLES: "false"
      APPLY_MIGRATIONS_ON_STARTUP: "false"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      SERVICE_ROLE: api
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      VNP_TMN_CODE: ${VNP_TMN_CODE:?set VNP_TMN_CODE}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET:?set VNP_HASH_SECRET}
      VNP_URL: ${VNP_URL:?set VNP_URL}
      VNP_RETURN_URL: ${VNP_RETURN_URL:?set VNP_RETURN_URL}
      VNP_API_URL: ${VNP_API_URL:?set VNP_API_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      ALLOW_WEBSOCKET_QUERY_TOKEN: "false"
      SCHEDULER_ENABLED: "false"
      VIEW_COUNT_FLUSH_ENABLED: "false"
      AUTO_CREATE_TABLES: "false"
      APPLY_MIGRATIONS_ON_STARTUP: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  moderation-worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "worker.py"]
    healthcheck:
      disable: true
    environment:
      ENVIRONMENT: production
      SERVICE_ROLE: worker
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      VNP_TMN_CODE: ${VNP_TMN_CODE:?set VNP_TMN_CODE}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET:?set VNP_HASH_SECRET}
      VNP_URL: ${VNP_URL:?set VNP_URL}
      VNP_RETURN_URL: ${VNP_RETURN_URL:?set VNP_RETURN_URL}
      VNP_API_URL: ${VNP_API_URL:?set VNP_API_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
      ALLOW_WEBSOCKET_QUERY_TOKEN: "false"
      SCHEDULER_ENABLED: "false"
      VIEW_COUNT_FLUSH_ENABLED: "false"
      AUTO_CREATE_TABLES: "false"
      APPLY_MIGRATIONS_ON_STARTUP: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DEPLOY_ENV: production
        NEXT_PUBLIC_APP_URL: ${FRONTEND_PUBLIC_URL:?set FRONTEND_PUBLIC_URL}
        NEXT_PUBLIC_API_BASE_URL: ${API_PUBLIC_URL:?set API_PUBLIC_URL}
        NEXT_PUBLIC_WS_BASE_URL: ${WS_PUBLIC_URL:?set WS_PUBLIC_URL}
        NEXT_PUBLIC_USE_MOCKS: "false"
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
