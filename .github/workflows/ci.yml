name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Đảm bảo chỉ 1 workflow chạy trên cùng branch/PR tại 1 thời điểm
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ╔══════════════════════════════════════════════════════════════════╗
# ║                       PERMISSIONS                               ║
# ╚══════════════════════════════════════════════════════════════════╝
permissions:
  contents: read
  pull-requests: write  # Để comment coverage lên PR

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1: Backend CI — Lint, Migrate, Test
  # ────────────────────────────────────────────────────────────
  backend:
    name: "🐍 Backend CI (Python 3.11)"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: yag_user
          POSTGRES_PASSWORD: yag_secret
          POSTGRES_DB: yag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./src/backend

    env:
      DATABASE_URL: postgresql://yag_user:yag_secret@localhost:5432/yag_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      GEMINI_API_KEY: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Lint — Syntax errors & critical issues
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint — Code quality warnings
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run database migrations
        run: python -m app.manage_migrations

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: src/backend/coverage.xml
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # JOB 2: Frontend CI — Lint, Type-check, Build
  # ────────────────────────────────────────────────────────────
  frontend:
    name: "⚛ Frontend CI (Node.js 20)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Build check (type-safe compilation)
        run: npm run build

  # ────────────────────────────────────────────────────────────
  # JOB 3: Security Scanning — Dependency vulnerabilities
  # ────────────────────────────────────────────────────────────
  security:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Python dependencies
        working-directory: ./src/backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc --output json || true
        continue-on-error: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit npm dependencies
        working-directory: ./src/frontend
        run: npm audit --omit=dev || true
        continue-on-error: true

  # ────────────────────────────────────────────────────────────
  # JOB 4: Docker Build Validation
  # ────────────────────────────────────────────────────────────
  docker:
    name: "🐳 Docker Build Check"
    runs-on: ubuntu-latest
    # Chỉ chạy trên push to main hoặc PR to main (tránh tốn CI minutes)
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -t yag-backend:ci-${{ github.sha }} ./src/backend
          echo "✅ Backend Docker image built successfully"

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL=https://ci-test.local \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://ci-test.local/api \
            --build-arg NEXT_PUBLIC_WS_BASE_URL=wss://ci-test.local/ws \
            -t yag-frontend:ci-${{ github.sha }} ./src/frontend
          echo "✅ Frontend Docker image built successfully"

  # ────────────────────────────────────────────────────────────
  # JOB 5: CD — Database Migrations (Production)
  # ────────────────────────────────────────────────────────────
  deploy-migrations:
    name: "🗄️ Apply Production Migrations"
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.DATABASE_URL != ''

    environment: production

    defaults:
      run:
        working-directory: ./src/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      # Cài đầy đủ dependencies (fix bug thiếu pydantic-settings)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️ DATABASE_URL secret is not configured. Skipping."
            exit 0
          fi
          python -m app.manage_migrations --check && echo "✅ No pending migrations" || echo "📦 Pending migrations detected"

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️ DATABASE_URL secret is not configured. Skipping migrations."
            exit 0
          fi
          python -m app.manage_migrations
          echo "✅ Database migrations applied successfully to production."

  # ────────────────────────────────────────────────────────────
  # JOB 6: CD — Deploy Backend to Google Cloud Run
  # ────────────────────────────────────────────────────────────
  deploy-backend:
    name: "☁️ Deploy Backend → Cloud Run"
    needs: [deploy-migrations]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.GCP_SA_KEY != ''

    environment:
      name: 'production'
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build and push Docker image
        run: |
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT_ID }}/yag-backend:${{ github.sha }}"
          docker build -t $IMAGE ./src/backend
          docker push $IMAGE
          echo "✅ Image pushed: $IMAGE"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: yag-backend
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/yag-backend:${{ github.sha }}
          region: ${{ secrets.GCP_REGION || 'asia-southeast1' }}
          env_vars: |
            ENVIRONMENT=production
            SERVICE_ROLE=api
          secrets: |
            DATABASE_URL=yag-database-url:latest
            SECRET_KEY=yag-secret-key:latest
            REDIS_URL=yag-redis-url:latest
            RABBITMQ_URL=yag-rabbitmq-url:latest
            GEMINI_API_KEY=yag-gemini-key:latest
            CLOUDINARY_CLOUD_NAME=yag-cloudinary-name:latest
            CLOUDINARY_API_KEY=yag-cloudinary-key:latest
            CLOUDINARY_API_SECRET=yag-cloudinary-secret:latest
            VNP_TMN_CODE=yag-vnp-tmn-code:latest
            VNP_HASH_SECRET=yag-vnp-hash-secret:latest
          flags: |
            --allow-unauthenticated
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --max-instances=3
            --timeout=300

      - name: Verify deployment health
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "🔍 Checking health at $URL/health/ready ..."
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health/ready" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Backend deployment healthy (HTTP $STATUS)"
          else
            echo "⚠️ Health check returned HTTP $STATUS (service may still be starting)"
          fi

  # ────────────────────────────────────────────────────────────
  # JOB 7: CD — Deployment Summary
  # ────────────────────────────────────────────────────────────
  deploy-summary:
    name: "📋 Deployment Summary"
    needs: [deploy-migrations, deploy-backend]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Generate deployment report
        run: |
          echo "## 🚀 Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| DB Migrations | ${{ needs.deploy-migrations.result == 'success' && '✅ Applied' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (Cloud Run) | ${{ needs.deploy-backend.result == 'success' && '✅ Deployed' || needs.deploy-backend.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (Vercel) | ✅ Auto-deployed via GitHub integration |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────
  # JOB 8: SonarQube / SonarCloud Code Analysis
  # ────────────────────────────────────────────────────────────
  sonarqube:
    name: "📊 SonarQube Quality Scan"
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Chỉ chạy nếu SONAR_TOKEN được cấu hình trên repo
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request') && secrets.SONAR_TOKEN != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Backend Coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: src/backend/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}